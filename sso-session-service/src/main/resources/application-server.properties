# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${SSO_SESSION_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sso_session_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SSO_SESSION_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${SSO_SESSION_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
sso.session.ttl-seconds=${SSO_SESSION_TTL_SECONDS:86400}
sso-session.internal.username=${SSO_SESSION_INTERNAL_USERNAME:sso_session_internal}
sso-session.internal.password=${SSO_SESSION_INTERNAL_PASSWORD:sso_session_secret}
tenant-service.base-url=${TENANT_SERVICE_BASE_URL:http://tenant-service:9129}
storefront-service.base-url=${STOREFRONT_SERVICE_BASE_URL:http://storefront-service:9115}
