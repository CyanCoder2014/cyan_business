server.port=9120
spring.application.name=automation-orchestrator-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.data.mongodb.uri=mongodb://localhost:27017/automation_orchestrator_service
spring.data.mongodb.auto-index-creation=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=automation_orchestrator_internal
service.internal.password=automation_orchestrator_secret
dynamic.runtime.service-key=automation-orchestrator-service
dynamic.runtime.check-missing-fields=true
dynamic.runtime.check-extra-fields=true
automation.callback.secret=localdemo-secret
automation.callback.timestamp-header=X-Dynamic-Flow-Timestamp
automation.callback.signature-header=X-Dynamic-Flow-Signature
