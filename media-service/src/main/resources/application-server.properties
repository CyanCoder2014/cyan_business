# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${MEDIA_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/media_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${MEDIA_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${MEDIA_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.mongodb.uri=${MEDIA_SERVICE_MONGODB_URI:mongodb://mongo:27017/media_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${MEDIA_SERVICE_INTERNAL_USERNAME:media_internal}
service.internal.password=${MEDIA_SERVICE_INTERNAL_PASSWORD:media_secret}
tenant-service.base-url=${TENANT_SERVICE_BASE_URL:http://tenant-service:9129}
tenant-service.internal.username=${TENANT_SERVICE_INTERNAL_USERNAME:tenant_internal}
tenant-service.internal.password=${TENANT_SERVICE_INTERNAL_PASSWORD:tenant_secret}
