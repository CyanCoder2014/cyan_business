apiVersion: apps/v1
kind: Deployment
metadata:
  name: panel-web
  labels:
    app.kubernetes.io/name: panel-web
    app.kubernetes.io/part-of: cyan-business
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: panel-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: panel-web
        app.kubernetes.io/part-of: cyan-business
    spec:
      containers:
        - name: panel-web
          image: ghcr.io/your-org/cyan-business/panel-web:develop
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "3000"
            - name: NEXT_PUBLIC_PLATFORM_API_BASE_URL
              value: https://api.cyancoder.com
            - name: PANEL_BFF_TIMEOUT_MS
              value: "30000"
            - name: SSO_AUTH_SERVICE_BASE_URL
              value: http://sso-auth-service:9001
            - name: SSO_USER_SERVICE_BASE_URL
              value: http://sso-user-service:9002
            - name: SSO_CAPTCHA_SERVICE_BASE_URL
              value: http://sso-captcha-service:9003
            - name: SSO_OTP_SERVICE_BASE_URL
              value: http://sso-otp-service:9004
            - name: SSO_SESSION_SERVICE_BASE_URL
              value: http://sso-session-service:9005
            - name: SSO_FIDO_SERVICE_BASE_URL
              value: http://sso-fido-service:9006
            - name: CONTENT_SERVICE_BASE_URL
              value: http://content-service:9101
            - name: CATALOG_SERVICE_BASE_URL
              value: http://catalog-service:9102
            - name: CRM_SERVICE_BASE_URL
              value: http://crm-service:9103
            - name: COMMERCE_SERVICE_BASE_URL
              value: http://commerce-service:9104
            - name: FINANCE_SERVICE_BASE_URL
              value: http://finance-service:9105
            - name: INVENTORY_SERVICE_BASE_URL
              value: http://inventory-service:9106
            - name: REPORT_SERVICE_BASE_URL
              value: http://report-service:9107
            - name: PROCESSOR_SERVICE_BASE_URL
              value: http://processor-service:9108
            - name: EVENT_SERVICE_BASE_URL
              value: http://event-service:9109
            - name: PAYMENT_SERVICE_BASE_URL
              value: http://payment-service:9114
            - name: STOREFRONT_SERVICE_BASE_URL
              value: http://storefront-service:9115
            - name: MEDIA_SERVICE_BASE_URL
              value: http://media-service:9116
            - name: CART_SERVICE_BASE_URL
              value: http://cart-service:9117
            - name: CHECKOUT_SERVICE_BASE_URL
              value: http://checkout-service:9118
            - name: BPM_SERVICE_BASE_URL
              value: http://bpm-service:9119
            - name: AUTOMATION_ORCHESTRATOR_SERVICE_BASE_URL
              value: http://automation-orchestrator-service:9120
            - name: AI_ORCHESTRATOR_SERVICE_BASE_URL
              value: http://ai-orchestrator-service:9121
            - name: NOTIFICATION_SERVICE_BASE_URL
              value: http://notification-service:9122
            - name: PAYMENT_ORCHESTRATOR_SERVICE_BASE_URL
              value: http://payment-orchestrator-service:9123
            - name: PRICING_PROMOTION_SERVICE_BASE_URL
              value: http://pricing-promotion-service:9124
            - name: SEARCH_INDEX_SERVICE_BASE_URL
              value: http://search-index-service:9125
            - name: BOT_ADAPTER_SERVICE_BASE_URL
              value: http://bot-adapter-service:9126
            - name: BATCH_WORKER_SERVICE_BASE_URL
              value: http://batch-worker-service:9127
            - name: API_DOCS_SERVICE_BASE_URL
              value: http://api-docs-service:9128
            - name: TENANT_SERVICE_BASE_URL
              value: http://tenant-service:9129
            - name: BILLING_SERVICE_BASE_URL
              value: http://billing-service:9130
          readinessProbe:
            httpGet:
              path: /auth
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /auth
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: panel-web
  labels:
    app.kubernetes.io/name: panel-web
    app.kubernetes.io/part-of: cyan-business
spec:
  selector:
    app.kubernetes.io/name: panel-web
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cyancoder-panel-https
  namespace: cyan-staging
spec:
  parentRefs:
    - name: cyan-gateway
      namespace: cyan-staging
      sectionName: cyancoder-https
  hostnames:
    - cyancoder.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: panel-web
          port: 3000
