# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${TAX_PAY_SYS_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tax_pay_sys}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${TAX_PAY_SYS_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${TAX_PAY_SYS_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.data.mongodb.uri=${TAX_PAY_SYS_MONGODB_URI:mongodb://mongo:27017/tax_pay_sys}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${TAX_PAY_SYS_INTERNAL_USERNAME:tax_internal}
service.internal.password=${TAX_PAY_SYS_INTERNAL_PASSWORD:tax_secret}
axon.axonserver.servers=${AXON_SERVER_SERVERS:axon-server:8124}
axon.axonserver.token=${AXON_SERVER_TOKEN:123cba}
factor.service.base-url=${FACTOR_SERVICE_BASE_URL:http://factor-service:8003}
client.service.base-url=${CLIENT_SERVICE_BASE_URL:http://client-service:8010}
external.home.base-url=${EXTERNAL_HOME_BASE_URL:http://localhost:8081}
