spring.application.name=ai-orchestrator-service
server.port=9121
spring.data.mongodb.uri=mongodb://localhost:27017/ai_orchestrator_service

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json

service.internal.username=ai_orchestrator_internal
service.internal.password=ai_orchestrator_secret

llm.provider=HEURISTIC
llm.gapgpt.base-url=https://api.gapgpt.app
llm.gapgpt.model=gpt-4o
llm.gapgpt.completions-path=/v1/chat/completions
llm.max-parse-attempts=1
rag.enabled=true
rag.bootstrap-enabled=true
rag.bootstrap-resource-pattern=classpath:/rag/*.md
rag.top-k=5

platform.metadata.service-keys=content-service,catalog-service,crm-service,commerce-service,finance-service,inventory-service,report-service,storefront-service,media-service,cart-service,checkout-service,payment-orchestrator-service,pricing-promotion-service,search-index-service,notification-service,bpm-service
