# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${NOTIFICATION_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/notification_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${NOTIFICATION_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${NOTIFICATION_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.mongodb.uri=${NOTIFICATION_SERVICE_MONGODB_URI:mongodb://mongo:27017/notification_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
service.internal.username=${NOTIFICATION_SERVICE_INTERNAL_USERNAME:notification_internal}
service.internal.password=${NOTIFICATION_SERVICE_INTERNAL_PASSWORD:notification_secret}
notification.sms.kavenegar.api-key=${KAVENEGAR_API_KEY:}
notification.sms.kavenegar.sender-line=${KAVENEGAR_SENDER_LINE:}
notification.email.smtp.host=${SMTP_HOST:}
notification.email.smtp.port=${SMTP_PORT:587}
notification.email.smtp.username=${SMTP_USERNAME:}
notification.email.smtp.password=${SMTP_PASSWORD:}
notification.email.smtp.from-address=${SMTP_FROM_ADDRESS:}
notification.email.smtp.from-name=${SMTP_FROM_NAME:Cyan Coder}
notification.email.smtp.starttls=${SMTP_STARTTLS:true}
