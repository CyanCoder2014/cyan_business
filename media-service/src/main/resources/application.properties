server.port=9116
spring.application.name=media-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=jdbc:postgresql://localhost:5432/media_service
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.mongodb.uri=mongodb://localhost:27017/media_service
spring.data.mongodb.auto-index-creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=99
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=media_internal
service.internal.password=media_secret
dynamic.runtime.service-key=media-service
dynamic.runtime.check-missing-fields=true
dynamic.runtime.check-extra-fields=true
media.storage.root=${MEDIA_STORAGE_ROOT:./data/uploads}
media.storage.max-upload-bytes=${MEDIA_STORAGE_MAX_UPLOAD_BYTES:52428800}
media.storage.prepare-ttl-seconds=${MEDIA_STORAGE_PREPARE_TTL_SECONDS:900}
tenant-service.base-url=${TENANT_SERVICE_BASE_URL:http://localhost:9129}
billing-service.base-url=${BILLING_SERVICE_BASE_URL:http://localhost:9130}
