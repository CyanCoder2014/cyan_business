name: Cyan CI/CD

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

concurrency:
  group: cyan-${{ github.ref }}
  cancel-in-progress: false

jobs:

  validate:
    name: Build and validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build


  deploy:
    name: Deploy Cyan
    needs: validate

    # kustomization.yaml hardcodes the cyan-staging namespace and there is no
    # production overlay yet, so only develop pushes deploy for now.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on:
      - self-hosted
      - linux
      - x64
      - cyan-deploy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x deploy/scripts/deploy-staging.sh

      - name: Deploy
        run: ./deploy/scripts/deploy-staging.sh