plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'

}

group = 'com.cyancoder'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '25'
}

repositories {
	mavenCentral()
	maven { url 'https://mirror-maven.runflare.com/maven2/' }
	maven { url 'https://mirror-maven.runflare.com/android/maven2/' }
	maven { url 'https://mirror-maven.runflare.com/gradle-plugins/' }
}

allprojects {
	repositories {
		mavenCentral()
		maven { url 'https://mirror-maven.runflare.com/maven2/' }
		maven { url 'https://mirror-maven.runflare.com/android/maven2/' }
		maven { url 'https://mirror-maven.runflare.com/gradle-plugins/' }
	}
}

subprojects {
	configurations.configureEach {
		resolutionStrategy.force 'org.projectlombok:lombok:1.18.46'
	}

	tasks.withType(JavaCompile).configureEach {
		options.compilerArgs << '-parameters'
	}

	plugins.withId('org.springframework.boot') {
		dependencies {
			implementation project(':platform-error-handling')
			if (project.name != 'generic') {
				implementation project(':platform-openapi-core')
				if (project.name == 'api-gateway') {
					implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.3'
				} else {
					implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
				}
			}
		}
	}
}

ext {
	set('springCloudVersion', "2025.1.1")
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

//	implementation 'org.axonframework:axon-spring-boot-starter'





}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

// root project is not a deployable application; it has no main class
bootJar { enabled = false }
jar { enabled = true }
