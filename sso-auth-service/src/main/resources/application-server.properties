# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.client.simple.instances.sso-user-service[0].uri=http://sso-user-service:9002
spring.cloud.discovery.client.simple.instances.sso-session-service[0].uri=http://sso-session-service:9005
spring.cloud.discovery.client.simple.instances.sso-otp-service[0].uri=http://sso-otp-service:9004
spring.cloud.discovery.client.simple.instances.sso-captcha-service[0].uri=http://sso-captcha-service:9003
spring.cloud.discovery.client.simple.instances.sso-fido-service[0].uri=http://sso-fido-service:9006
spring.datasource.url=${SSO_AUTH_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sso_auth_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SSO_AUTH_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${SSO_AUTH_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
sso.jwt.issuer=${SSO_JWT_ISSUER:https://api.example.com}
sso.jwt.audience=${SSO_JWT_AUDIENCE:cyan-business}
sso-session.internal.username=${SSO_SESSION_INTERNAL_USERNAME:sso_session_internal}
sso-session.internal.password=${SSO_SESSION_INTERNAL_PASSWORD:sso_session_secret}
