apiVersion: v1
kind: Secret
metadata:
  name: cyan-platform-secrets
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: postgres
  SPRING_DATASOURCE_PASSWORD: change-me
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWKS_URI: http://sso-auth-service:9001/.well-known/jwks.json
  SSO_JWT_ISSUER: https://api.cyancoder.com
  SSO_JWT_AUDIENCE: cyan-business
  PUBLIC_PLATFORM_BASE_URL: https://api.cyancoder.com
  AXON_SERVER_SERVERS: axon-server:8124
  AXON_SERVER_TOKEN: change-me
  AUTOMATION_CALLBACK_SECRET: change-me
  OPENAI_API_KEY: ""
  OPENROUTER_API_KEY: ""
  GAPGPT_API_KEY: ""
  # Model ids for the above. The built-in OPENROUTER default ("openrouter/free")
  # is a placeholder, not a real model id, so OpenRouter needs this set to work.
  GAPGPT_MODEL: "gpt-4o"
  OPENROUTER_MODEL: ""
  # Provider order is OPENAI, GAPGPT, OPENROUTER, OLLAMA, HEURISTIC. Unset keys
  # are skipped; HEURISTIC is the keyword fallback that returns a stock
  # blueprint, which AI Studio now flags in the UI.
  #
  # Deliberately no AVAILABLE_SERVICE_KEYS here: an empty value would override
  # the in-image default and make AI Studio skip provisioning for every
  # service. Set it only to narrow the list, never to blank it.
  CONTENT_SERVICE_INTERNAL_PASSWORD: change-me
  CATALOG_SERVICE_INTERNAL_PASSWORD: change-me
  CRM_SERVICE_INTERNAL_PASSWORD: change-me
  COMMERCE_SERVICE_INTERNAL_PASSWORD: change-me
  FINANCE_SERVICE_INTERNAL_PASSWORD: change-me
  INVENTORY_SERVICE_INTERNAL_PASSWORD: change-me
  REPORT_SERVICE_INTERNAL_PASSWORD: change-me
  MEDIA_SERVICE_INTERNAL_PASSWORD: change-me
  CART_SERVICE_INTERNAL_PASSWORD: change-me
  CHECKOUT_SERVICE_INTERNAL_PASSWORD: change-me
  PAYMENT_SERVICE_INTERNAL_PASSWORD: change-me
  PRICING_PROMOTION_SERVICE_INTERNAL_PASSWORD: change-me
  SEARCH_INDEX_SERVICE_INTERNAL_PASSWORD: change-me
  AI_ORCHESTRATOR_SERVICE_INTERNAL_PASSWORD: change-me
  BPM_SERVICE_INTERNAL_PASSWORD: change-me
  NOTIFICATION_SERVICE_INTERNAL_PASSWORD: change-me
  SSO_USER_SERVICE_INTERNAL_PASSWORD: change-me
  TENANT_SERVICE_INTERNAL_PASSWORD: change-me
  BILLING_SERVICE_INTERNAL_PASSWORD: change-me
  BATCH_WORKER_DATASOURCE_URL: jdbc:postgresql://postgres:5432/batch_worker_service
  BATCH_WORKER_DATASOURCE_USERNAME: postgres
  BATCH_WORKER_DATASOURCE_PASSWORD: change-me
  BATCH_WORKER_SERVICE_INTERNAL_PASSWORD: change-me
  API_DOCS_SERVICE_INTERNAL_PASSWORD: change-me
  PLATFORM_OPENAPI_DOCS_USERNAME: platform_docs
  PLATFORM_OPENAPI_DOCS_PASSWORD: change-me
  KAVENEGAR_API_KEY: ""
  KAVENEGAR_SENDER_LINE: ""
  KAVENEGAR_OTP_TEMPLATE: ""
  KAVENEGAR_DEFAULT_LANGUAGE: "fa"
  KAVENEGAR_TEMPLATE_LOGIN_FA: ""
  KAVENEGAR_TEMPLATE_LOGIN_EN: ""
  KAVENEGAR_TEMPLATE_RESET_FA: ""
  KAVENEGAR_TEMPLATE_RESET_EN: ""
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_ADDRESS: ""
  SMTP_FROM_NAME: "Cyan Coder"
  SMTP_STARTTLS: "true"
