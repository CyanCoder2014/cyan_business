# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.client.simple.instances.tax-service[0].uri=http://tax-pay-sys:8002
spring.datasource.url=${FACTOR_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/factor_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${FACTOR_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${FACTOR_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.mongodb.uri=${FACTOR_SERVICE_MONGODB_URI:mongodb://mongo:27017/factor_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${FACTOR_SERVICE_INTERNAL_USERNAME:factor_internal}
service.internal.password=${FACTOR_SERVICE_INTERNAL_PASSWORD:factor_secret}
