server.port=9107
spring.application.name=report-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=jdbc:postgresql://localhost:5432/report_service
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.mongodb.uri=mongodb://localhost:27017/report_service
spring.data.mongodb.auto-index-creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=report_internal
service.internal.password=report_secret
dynamic.runtime.service-key=report-service
dynamic.runtime.check-missing-fields=true
dynamic.runtime.check-extra-fields=true
tenant-service.base-url=${TENANT_SERVICE_BASE_URL:http://localhost:9129}
media-service.base-url=${MEDIA_SERVICE_BASE_URL:http://localhost:9116}
platform.health.service-keys=ai-orchestrator-service,automation-orchestrator-service,bpm-service,media-service,report-service,storefront-service,tenant-service,notification-service,bot-adapter-service
