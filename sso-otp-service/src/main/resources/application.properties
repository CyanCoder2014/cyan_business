server.port=9004
spring.application.name=sso-otp-service
platform.openapi.default-security=NONE
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=${SSO_OTP_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sso_otp_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SSO_OTP_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SSO_OTP_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
otp.sms.kavenegar.api-key=${KAVENEGAR_API_KEY:}
otp.sms.kavenegar.template=${KAVENEGAR_OTP_TEMPLATE:}
otp.sms.kavenegar.default-language=${KAVENEGAR_DEFAULT_LANGUAGE:fa}
otp.sms.kavenegar.templates.login.fa=${KAVENEGAR_TEMPLATE_LOGIN_FA:}
otp.sms.kavenegar.templates.login.en=${KAVENEGAR_TEMPLATE_LOGIN_EN:}
otp.sms.kavenegar.templates.password-reset.fa=${KAVENEGAR_TEMPLATE_RESET_FA:}
otp.sms.kavenegar.templates.password-reset.en=${KAVENEGAR_TEMPLATE_RESET_EN:}
# Local development only. The server profile forces this off — see
# application-server.properties.
otp.expose-dev-code=${OTP_EXPOSE_DEV_CODE:true}
