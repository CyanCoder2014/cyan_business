spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${LEGACY_DB_URL:jdbc:postgresql://localhost:5432/tax_pay_sys}
spring.datasource.username=${LEGACY_DB_USERNAME:postgres}
spring.datasource.password=${LEGACY_DB_PASSWORD:postgres}
spring.jpa.show-sql=true




spring.main.allow-bean-definition-overriding=true

feign.client.config.default.loggerLevel=BASIC

logging.level.com.cyan.open_exchange.client.web.rest.*=DEBUG



feign.httpclient.enabled= true
feign.okhttp.enabled= true


eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.application.name=tax-pay-sys
spring.mongodb.uri=mongodb://localhost:27017/tax_pay_sys
spring.data.mongodb.auto-index-creation=true
service.internal.username=tax_internal
service.internal.password=tax_secret
dynamic.runtime.service-key=tax-pay-sys
dynamic.runtime.check-missing-fields=true
dynamic.runtime.check-extra-fields=true
#eureka.client.register-with-eureka=false
#eureka.client.fetch-registry=false



spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json

feign.client.config.default.connectTimeout= 160000000
feign.client.config.default.readTimeout= 160000000
