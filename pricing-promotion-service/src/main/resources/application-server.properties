# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${PRICING_PROMOTION_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/pricing_promotion_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PRICING_PROMOTION_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${PRICING_PROMOTION_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.data.mongodb.uri=${PRICING_PROMOTION_SERVICE_MONGODB_URI:mongodb://mongo:27017/pricing_promotion_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${PRICING_PROMOTION_SERVICE_INTERNAL_USERNAME:pricing_promotion_internal}
service.internal.password=${PRICING_PROMOTION_SERVICE_INTERNAL_PASSWORD:pricing_promotion_secret}
