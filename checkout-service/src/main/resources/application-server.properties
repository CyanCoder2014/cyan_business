# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.client.simple.instances.cart-service[0].uri=http://cart-service:9117
spring.cloud.discovery.client.simple.instances.pricing-promotion-service[0].uri=http://pricing-promotion-service:9124
spring.cloud.discovery.client.simple.instances.payment-orchestrator-service[0].uri=http://payment-orchestrator-service:9123
spring.cloud.discovery.client.simple.instances.notification-service[0].uri=http://notification-service:9122
spring.datasource.url=${CHECKOUT_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/checkout_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${CHECKOUT_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${CHECKOUT_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.data.mongodb.uri=${CHECKOUT_SERVICE_MONGODB_URI:mongodb://mongo:27017/checkout_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${CHECKOUT_SERVICE_INTERNAL_USERNAME:checkout_internal}
service.internal.password=${CHECKOUT_SERVICE_INTERNAL_PASSWORD:checkout_secret}
