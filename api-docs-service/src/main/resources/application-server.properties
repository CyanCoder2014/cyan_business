server.port=${API_DOCS_SERVICE_PORT:9128}
spring.application.name=api-docs-service
service.internal.username=${API_DOCS_SERVICE_INTERNAL_USERNAME:api_docs_internal}
service.internal.password=${API_DOCS_SERVICE_INTERNAL_PASSWORD:api_docs_secret}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SSO_JWK_SET_URI:http://sso-auth-service:9001/.well-known/jwks.json}
platform.openapi.docs-access=${PLATFORM_OPENAPI_DOCS_ACCESS:BASIC}
platform.api-docs.cache-seconds=${PLATFORM_API_DOCS_CACHE_SECONDS:60}
platform.api-docs.connect-timeout-ms=${PLATFORM_API_DOCS_CONNECT_TIMEOUT_MS:3000}
platform.api-docs.read-timeout-ms=${PLATFORM_API_DOCS_READ_TIMEOUT_MS:10000}
platform.api-docs.targets-json=${PLATFORM_API_DOCS_TARGETS_JSON:[]}
