apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-worker-service
  namespace: cyan-staging
  labels:
    app.kubernetes.io/name: batch-worker-service
    app.kubernetes.io/part-of: cyan-business
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: batch-worker-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: batch-worker-service
        app.kubernetes.io/part-of: cyan-business
    spec:
      containers:
        - name: batch-worker-service
          image: ghcr.io/your-org/cyan-business/batch-worker-service:develop
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9127
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: server
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65.0
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: EUREKA_CLIENT_ENABLED
              value: "false"
          envFrom:
            - secretRef:
                name: cyan-platform-secrets
                optional: true
          resources:
            requests:
              cpu: 150m
              memory: 448Mi
            limits:
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: batch-worker-service
  namespace: cyan-staging
  labels:
    app.kubernetes.io/name: batch-worker-service
    app.kubernetes.io/part-of: cyan-business
spec:
  selector:
    app.kubernetes.io/name: batch-worker-service
  ports:
    - name: http
      port: 9127
      targetPort: http
---
