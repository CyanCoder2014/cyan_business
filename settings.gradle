pluginManagement {
    repositories {
        mavenCentral()
        maven { url 'https://mirror-maven.runflare.com/gradle-plugins/' }
        maven { url 'https://mirror-maven.runflare.com/maven2/' }
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { url 'https://mirror-maven.runflare.com/maven2/' }
        maven { url 'https://mirror-maven.runflare.com/android/maven2/' }
        maven { url 'https://mirror-maven.runflare.com/gradle-plugins/' }
    }
}

