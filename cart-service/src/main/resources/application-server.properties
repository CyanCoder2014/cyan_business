# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${CART_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cart_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${CART_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${CART_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.mongodb.uri=${CART_SERVICE_MONGODB_URI:mongodb://mongo:27017/cart_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${CART_SERVICE_INTERNAL_USERNAME:cart_internal}
service.internal.password=${CART_SERVICE_INTERNAL_PASSWORD:cart_secret}
