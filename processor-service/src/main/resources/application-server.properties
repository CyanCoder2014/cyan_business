# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${PROCESSOR_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/processor_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PROCESSOR_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${PROCESSOR_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
