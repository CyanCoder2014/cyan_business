server.port=9123
spring.application.name=payment-orchestrator-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_orchestrator_service
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.mongodb.uri=mongodb://localhost:27017/payment_orchestrator_service
spring.data.mongodb.auto-index-creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=payment_orchestrator_internal
service.internal.password=payment_orchestrator_secret
dynamic.runtime.service-key=payment-orchestrator-service
dynamic.runtime.check-missing-fields=true
dynamic.runtime.check-extra-fields=true
