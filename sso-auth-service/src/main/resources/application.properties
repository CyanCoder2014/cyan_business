server.port=9001
spring.application.name=sso-auth-service
platform.openapi.default-security=NONE
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
sso.jwt.issuer=http://localhost:9001
sso.jwt.audience=cyan-business
sso.jwt.ttl-seconds=3600
sso-session.internal.username=sso_session_internal
sso-session.internal.password=sso_session_secret
spring.datasource.url=jdbc:h2:file:./data/sso-auth-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
