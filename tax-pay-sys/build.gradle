plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'

}

group = 'com.cyancoder'
version = '0.0.1-SNAPSHOT'

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

java {
	sourceCompatibility = '25'
}

repositories {
	mavenCentral()
//	google()

//	maven {
//		// Look for POMs and artifacts, such as JARs, here
//		url "http://repo2.mycompany.com/maven2"
//		// Look for artifacts here if not found at the above location
//		artifactUrls "http://repo.mycompany.com/jars"
//		artifactUrls "http://repo.mycompany.com/jars2"
//	}
}


ext {
	set('springCloudVersion', "2025.1.1")
}


dependencies {






	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
//	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
//	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.projectlombok:lombok:1.18.46'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok:1.18.46'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.postgresql:postgresql'
//	testImplementation 'io.projectreactor:reactor-test'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	implementation 'org.apache.commons:commons-crypto:1.2.0'

	implementation 'org.apache.commons:commons-lang3:3.0'
	// No version: the Spring Boot BOM manages Jackson. Pinning 2.13.4 here
	// downgraded the whole module below the 2.14 that introduced DatatypeFeature,
	// so Spring's content negotiation failed at startup with NoClassDefFoundError.
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.squareup.okhttp3:okhttp:4.9.1'

	implementation 'com.github.eloyzone:jalali-calendar:1.0.0'

	implementation 'org.apache.poi:poi-ooxml:4.1.2'

	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'

	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
//	implementation 'org.springframework.security.oauth.boot:spring-security-oauth2-autoconfigure:2.1.0.RELEASE'
//	implementation 'org.springframework.security.oauth:spring-security-oauth2-client'
//	compile group: 'org.springframework.security', name: 'spring-security-oauth2-client', version: '5.0.0.RELEASE'

	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation project(':dynamic-entity-core')

//	implementation 'com.fasterxml.jackson.core:jackson-core:2.5.2'


	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
//	implementation 'io.github.resilience4j:resilience4j-retry:2.3.0'


}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.named('test') {
	useJUnitPlatform()
}
