server.port=9109
spring.application.name=event-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=${EVENT_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/event_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${EVENT_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${EVENT_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.auto-create=true
business.events.topic=business-events
event.kafka.dispatch.fixed-delay-ms=5000
