server.port=9005
spring.application.name=sso-session-service
platform.openapi.default-security=NONE
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.datasource.url=jdbc:h2:file:./data/sso-session-db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=99
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
tenant-service.base-url=http://localhost:9129
tenant-service.internal.username=tenant_internal
tenant-service.internal.password=tenant_secret
storefront-service.base-url=http://localhost:9115
storefront-service.internal.username=storefront_internal
storefront-service.internal.password=storefront_secret
