# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.client.simple.instances.automation-orchestrator-service[0].uri=http://automation-orchestrator-service:9120
spring.cloud.discovery.client.simple.instances.notification-service[0].uri=http://notification-service:9122
spring.cloud.discovery.client.simple.instances.content-service[0].uri=http://content-service:9101
spring.cloud.discovery.client.simple.instances.catalog-service[0].uri=http://catalog-service:9102
spring.cloud.discovery.client.simple.instances.crm-service[0].uri=http://crm-service:9103
spring.cloud.discovery.client.simple.instances.commerce-service[0].uri=http://commerce-service:9104
spring.cloud.discovery.client.simple.instances.finance-service[0].uri=http://finance-service:9105
spring.cloud.discovery.client.simple.instances.inventory-service[0].uri=http://inventory-service:9106
spring.cloud.discovery.client.simple.instances.report-service[0].uri=http://report-service:9107
spring.cloud.discovery.client.simple.instances.processor-service[0].uri=http://processor-service:9108
spring.cloud.discovery.client.simple.instances.storefront-service[0].uri=http://storefront-service:9115
spring.cloud.discovery.client.simple.instances.media-service[0].uri=http://media-service:9116
spring.cloud.discovery.client.simple.instances.cart-service[0].uri=http://cart-service:9117
spring.cloud.discovery.client.simple.instances.checkout-service[0].uri=http://checkout-service:9118
spring.cloud.discovery.client.simple.instances.payment-orchestrator-service[0].uri=http://payment-orchestrator-service:9123
spring.cloud.discovery.client.simple.instances.pricing-promotion-service[0].uri=http://pricing-promotion-service:9124
spring.cloud.discovery.client.simple.instances.search-index-service[0].uri=http://search-index-service:9125
spring.cloud.discovery.client.simple.instances.tenant-service[0].uri=http://tenant-service:9129
spring.datasource.url=${BPM_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/bpm_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${BPM_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${BPM_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.mongodb.uri=${BPM_SERVICE_MONGODB_URI:mongodb://mongo:27017/bpm_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${BPM_SERVICE_INTERNAL_USERNAME:bpm_internal}
service.internal.password=${BPM_SERVICE_INTERNAL_PASSWORD:bpm_secret}
