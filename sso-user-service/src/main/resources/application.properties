server.port=9002
spring.application.name=sso-user-service
platform.openapi.default-security=NONE
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.datasource.url=${SSO_USER_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sso_user_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SSO_USER_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SSO_USER_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=sso_user_internal
service.internal.password=sso_user_secret
