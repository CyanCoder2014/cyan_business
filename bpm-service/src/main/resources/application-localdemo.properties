spring.application.name=bpm-service
server.port=9119

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.mongodb.uri=mongodb://localhost:27017/bpm_service
spring.datasource.url=jdbc:postgresql://localhost:5432/bpm_service
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
flowable.database-schema-update=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json

service.internal.username=bpm_internal
service.internal.password=bpm_secret

bpm.seed.enabled=false
dynamic-flow.callback.enabled=true
dynamic-flow.callback.signature-header=X-Dynamic-Flow-Signature
dynamic-flow.callback.timestamp-header=X-Dynamic-Flow-Timestamp
dynamic-flow.callback.secret=localdemo-secret
dynamic-flow.callback.max-skew-seconds=300

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
