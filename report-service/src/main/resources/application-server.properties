# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.client.simple.instances.content-service[0].uri=http://content-service:9101
spring.cloud.discovery.client.simple.instances.catalog-service[0].uri=http://catalog-service:9102
spring.cloud.discovery.client.simple.instances.crm-service[0].uri=http://crm-service:9103
spring.cloud.discovery.client.simple.instances.commerce-service[0].uri=http://commerce-service:9104
spring.cloud.discovery.client.simple.instances.finance-service[0].uri=http://finance-service:9105
spring.cloud.discovery.client.simple.instances.inventory-service[0].uri=http://inventory-service:9106
media-service.base-url=${MEDIA_SERVICE_BASE_URL:http://media-service:9116}
media-service.internal.username=${MEDIA_SERVICE_INTERNAL_USERNAME:media_internal}
media-service.internal.password=${MEDIA_SERVICE_INTERNAL_PASSWORD:media_secret}
spring.datasource.url=${REPORT_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/report_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${REPORT_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${REPORT_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.data.mongodb.uri=${REPORT_SERVICE_MONGODB_URI:mongodb://mongo:27017/report_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${REPORT_SERVICE_INTERNAL_USERNAME:report_internal}
service.internal.password=${REPORT_SERVICE_INTERNAL_PASSWORD:report_secret}
