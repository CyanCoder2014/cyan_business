name: Cyan CI/CD

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

concurrency:
  group: cyan-${{ github.ref }}
  cancel-in-progress: false

jobs:

  validate:
    name: Build and validate
    runs-on: ubuntu-latest

    # Mirrors docker/databases and docker/kafka: services boot their Spring
    # context against real Postgres/Mongo/Kafka, not embedded fakes.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongo:
        image: mongo:7
        ports:
          - 27017:27017

      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Create service databases
        run: psql -h localhost -U postgres -f docker/databases/init/01-create-databases.sql
        env:
          PGPASSWORD: postgres

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build


  deploy:
    name: Deploy Cyan
    needs: validate

    # kustomization.yaml hardcodes the cyan-staging namespace and there is no
    # production overlay yet, so only develop pushes deploy for now.
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on:
      - self-hosted
      - linux
      - x64
      - cyan-deploy

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make scripts executable
        run: |
          chmod +x gradlew
          chmod +x deploy/scripts/deploy-staging.sh
          chmod +x deploy/scripts/detect-changed-services.sh

      - name: Detect changed services
        id: changes
        run: |
          SERVICES="$(./deploy/scripts/detect-changed-services.sh "${{ github.event.before }}" "${{ github.sha }}")"
          echo "Changed services: ${SERVICES:-<none>}"
          echo "services=${SERVICES}" >> "$GITHUB_OUTPUT"

      - name: Deploy changed services
        if: steps.changes.outputs.services != ''
        run: ./deploy/scripts/deploy-staging.sh ${{ steps.changes.outputs.services }}