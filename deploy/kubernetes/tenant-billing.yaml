apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-service
  labels:
    app.kubernetes.io/name: tenant-service
    app.kubernetes.io/part-of: cyan-business
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tenant-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tenant-service
        app.kubernetes.io/part-of: cyan-business
    spec:
      containers:
        - name: tenant-service
          image: ghcr.io/your-org/cyan-business/tenant-service:develop
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9129
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: server
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65.0
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: SSO_USER_SERVICE_BASE_URL
              value: http://sso-user-service:9002
            - name: BILLING_SERVICE_BASE_URL
              value: http://billing-service:9130
            - name: NOTIFICATION_SERVICE_BASE_URL
              value: http://notification-service:9122
            - name: TENANT_INVITATION_ACCEPT_BASE_URL
              value: https://cyancoder.com/auth/invitation
          envFrom:
            - secretRef:
                name: cyan-platform-secrets
                optional: true
          resources:
            requests:
              cpu: 150m
              memory: 448Mi
            limits:
              memory: 1536Mi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-service
  labels:
    app.kubernetes.io/name: tenant-service
    app.kubernetes.io/part-of: cyan-business
spec:
  selector:
    app.kubernetes.io/name: tenant-service
  ports:
    - name: http
      port: 9129
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: cyan-business
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing-service
        app.kubernetes.io/part-of: cyan-business
    spec:
      containers:
        - name: billing-service
          image: ghcr.io/your-org/cyan-business/billing-service:develop
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9130
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: server
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=65.0
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: "3"
            - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
              value: "1"
            - name: TENANT_SERVICE_BASE_URL
              value: http://tenant-service:9129
          envFrom:
            - secretRef:
                name: cyan-platform-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 320Mi
            limits:
              memory: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  labels:
    app.kubernetes.io/name: billing-service
    app.kubernetes.io/part-of: cyan-business
spec:
  selector:
    app.kubernetes.io/name: billing-service
  ports:
    - name: http
      port: 9130
      targetPort: http
