server.port=9105
spring.application.name=finance-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_service
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.mongodb.uri=mongodb://localhost:27017/finance_service
spring.data.mongodb.auto-index-creation=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=finance_internal
service.internal.password=finance_secret
dynamic.runtime.service-key=finance-service
dynamic.runtime.check-missing-fields=true
dynamic.runtime.check-extra-fields=true
processor.service.base-url=http://localhost:9108
event.service.base-url=http://localhost:9109
outbox.dispatch.fixed-delay-ms=5000
