spring.application.name=ai-orchestrator-service
server.port=9121
spring.mongodb.uri=mongodb://localhost:27017/ai_orchestrator_service

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json

service.internal.username=ai_orchestrator_internal
service.internal.password=ai_orchestrator_secret

llm.provider=AUTO
llm.max-parse-attempts=3
llm.fallback-order=OPENAI,GAPGPT,OPENROUTER,OLLAMA,HEURISTIC
llm.openai.api-key=
llm.openai.base-url=https://api.openai.com
llm.openai.model=gpt-4o-mini
llm.openai.completions-path=/v1/chat/completions
llm.openrouter.api-key=${OPENROUTER_API_KEY:}
llm.openrouter.base-url=https://openrouter.ai
llm.openrouter.model=${OPENROUTER_MODEL:openrouter/free}
llm.openrouter.completions-path=/api/v1/chat/completions
llm.openrouter.referer=${OPENROUTER_HTTP_REFERER:}
llm.openrouter.title=${OPENROUTER_APP_TITLE:ai-orchestrator-service}
llm.gapgpt.api-key=${GAPGPT_API_KEY:}
llm.gapgpt.base-url=https://api.gapgpt.app
llm.gapgpt.model=${GAPGPT_MODEL:gpt-4o}
llm.gapgpt.completions-path=/v1/chat/completions
llm.ollama.base-url=http://localhost:11434
llm.ollama.model=qwen2.5:7b
llm.ollama.completions-path=/api/chat

rag.enabled=true
rag.bootstrap-enabled=true
rag.bootstrap-resource-pattern=classpath:/rag/*.md
rag.top-k=5

platform.metadata.service-keys=ai-orchestrator-service,automation-orchestrator-service,batch-worker-service,processor-service,content-service,catalog-service,crm-service,commerce-service,finance-service,inventory-service,report-service,storefront-service,media-service,cart-service,checkout-service,payment-orchestrator-service,pricing-promotion-service,search-index-service,notification-service,bpm-service,sso-auth-service,sso-user-service,sso-captcha-service
