server.port=9127
spring.application.name=batch-worker-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka

spring.datasource.url=${BATCH_WORKER_DATASOURCE_URL:jdbc:postgresql://localhost:5432/batch_worker_service}
spring.datasource.username=${BATCH_WORKER_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${BATCH_WORKER_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
spring.task.scheduling.pool.size=4

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=batch_worker_internal
service.internal.password=batch_worker_secret

batch.worker.chunk-size=200
batch.worker.retry-limit=5
batch.worker.skip-limit=100
batch.worker.connect-timeout-ms=5000
batch.worker.read-timeout-ms=30000
batch.worker.recovery-poll-ms=5000
batch.worker.orphan-timeout=5m
batch.worker.lease-duration=2m
