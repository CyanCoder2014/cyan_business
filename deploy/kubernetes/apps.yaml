apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-pay-sys
  labels:
    app.kubernetes.io/name: tax-pay-sys
    app.kubernetes.io/part-of: cyan-business
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tax-pay-sys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tax-pay-sys
        app.kubernetes.io/part-of: cyan-business
    spec:
      containers:
        - name: tax-pay-sys
          image: ghcr.io/your-org/cyan-business/tax-pay-sys:develop
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: server
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75.0
          envFrom:
            - secretRef:
                name: cyan-platform-secrets
                optional: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: tax-pay-sys
  labels:
    app.kubernetes.io/name: tax-pay-sys
    app.kubernetes.io/part-of: cyan-business
spec:
  selector:
    app.kubernetes.io/name: tax-pay-sys
  ports:
    - name: http
      port: 8002
      targetPort: http
---
