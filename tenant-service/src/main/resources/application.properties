server.port=9129
spring.application.name=tenant-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=${TENANT_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tenant_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${TENANT_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${TENANT_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=tenant_internal
service.internal.password=tenant_secret
billing.service.base-url=http://localhost:9130
billing.service.internal.username=billing_internal
billing.service.internal.password=billing_secret
sso.user.service.base-url=http://localhost:9002
sso.user.service.internal.username=sso_user_internal
sso.user.service.internal.password=sso_user_secret
notification.service.base-url=http://localhost:9122
notification.service.internal.username=notification_internal
notification.service.internal.password=notification_secret
tenant.invitation.accept-base-url=http://localhost:3000/auth/invitation
platform.openapi.default-security=BEARER
