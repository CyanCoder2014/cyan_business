# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${SSO_OTP_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/sso_otp_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SSO_OTP_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${SSO_OTP_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
otp.sms.kavenegar.api-key=${KAVENEGAR_API_KEY:}
otp.sms.kavenegar.template=${KAVENEGAR_OTP_TEMPLATE:login}
# Never echo login codes in an API response on a deployed environment.
otp.expose-dev-code=false
