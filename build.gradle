plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.2'
	id 'io.spring.dependency-management' version '1.1.0'

}

group = 'com.cyancoder'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

repositories {
	mavenCentral()
	maven { url 'https://mirror-maven.runflare.com/maven2/' }
	maven { url 'https://mirror-maven.runflare.com/android/maven2/' }
	maven { url 'https://mirror-maven.runflare.com/gradle-plugins/' }
}

allprojects {
	repositories {
		mavenCentral()
		maven { url 'https://mirror-maven.runflare.com/maven2/' }
		maven { url 'https://mirror-maven.runflare.com/android/maven2/' }
		maven { url 'https://mirror-maven.runflare.com/gradle-plugins/' }
	}
}

subprojects {
	configurations.configureEach {
		resolutionStrategy.force 'org.projectlombok:lombok:1.18.34'
	}
}

ext {
	set('springCloudVersion', "2022.0.4")
}

dependencies {
	implementation 'org.springframework.cloud:spring-cloud-starter-config'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

//	implementation 'org.axonframework:axon-spring-boot-starter'





}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
