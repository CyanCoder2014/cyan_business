server.port=9126
spring.application.name=bot-adapter-service
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.mongodb.uri=mongodb://localhost:27017/bot_adapter_service
spring.data.mongodb.auto-index-creation=true
ai-orchestrator.base-url=http://localhost:9121
ai-orchestrator.public-base-url=http://localhost:8001
ai-orchestrator.telegram-base-url=https://api.telegram.org
ai-orchestrator.bale-base-url=https://tapi.bale.ai
ai-orchestrator.bot-secret-env-prefix=CYAN_BOT_SECRET_
ai-orchestrator.automation-base-url=http://localhost:9120
ai-orchestrator.automation-internal-username=automation_orchestrator_internal
ai-orchestrator.automation-internal-password=automation_orchestrator_secret
ai-orchestrator.bpm-base-url=http://localhost:9119
ai-orchestrator.bpm-internal-username=bpm_internal
ai-orchestrator.bpm-internal-password=bpm_secret
tenant-service.base-url=http://localhost:9129
tenant-service.internal.username=tenant_internal
tenant-service.internal.password=tenant_secret
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
