server.port=9130
spring.application.name=billing-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=${BILLING_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/billing_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${BILLING_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${BILLING_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=billing_internal
service.internal.password=billing_secret
tenant.service.base-url=http://localhost:9129
platform.openapi.default-security=BEARER
