server.port=9108
spring.application.name=processor-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=${PROCESSOR_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/processor_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PROCESSOR_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${PROCESSOR_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
