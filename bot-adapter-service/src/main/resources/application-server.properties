# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.mongodb.uri=${BOT_ADAPTER_SERVICE_MONGODB_URI:mongodb://mongo:27017/bot_adapter_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
ai-orchestrator.base-url=${AI_ORCHESTRATOR_BASE_URL:http://ai-orchestrator-service:9121}
ai-orchestrator.public-base-url=${PUBLIC_PLATFORM_BASE_URL:https://api.example.com}
ai-orchestrator.automation-base-url=${AUTOMATION_ORCHESTRATOR_SERVICE_BASE_URL:http://automation-orchestrator-service:9120}
ai-orchestrator.bpm-base-url=${BPM_SERVICE_BASE_URL:http://bpm-service:9119}
tenant-service.base-url=${TENANT_SERVICE_BASE_URL:http://tenant-service:9129}
