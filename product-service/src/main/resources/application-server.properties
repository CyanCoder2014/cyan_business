# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${PRODUCT_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/product_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${PRODUCT_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${PRODUCT_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.mongodb.uri=${PRODUCT_SERVICE_MONGODB_URI:mongodb://mongo:27017/product_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${PRODUCT_SERVICE_INTERNAL_USERNAME:product_internal}
service.internal.password=${PRODUCT_SERVICE_INTERNAL_PASSWORD:product_secret}
axon.axonserver.servers=${AXON_SERVER_SERVERS:axon-server:8124}
axon.axonserver.token=${AXON_SERVER_TOKEN:123cba}
