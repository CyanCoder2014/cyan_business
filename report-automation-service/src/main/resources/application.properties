server.port=9113
spring.application.name=report-automation-service
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.datasource.url=${REPORT_AUTOMATION_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/report_automation_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${REPORT_AUTOMATION_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${REPORT_AUTOMATION_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=report-automation-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
business.events.topic=business-events
