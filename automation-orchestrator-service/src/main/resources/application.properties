server.port=9120
spring.application.name=automation-orchestrator-service
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
spring.mongodb.uri=mongodb://localhost:27017/automation_orchestrator_service
spring.data.mongodb.auto-index-creation=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
service.internal.username=automation_orchestrator_internal
service.internal.password=automation_orchestrator_secret
dynamic.runtime.service-key=automation-orchestrator-service
dynamic.runtime.check-missing-fields=true
dynamic.runtime.check-extra-fields=true
automation.callback.secret=change-me
automation.callback.timestamp-header=X-Dynamic-Flow-Timestamp
automation.callback.signature-header=X-Dynamic-Flow-Signature
automation.worker.lease-duration=5m
automation.worker.orphan-grace=30s
automation.worker.recovery-batch-size=20
automation.worker.recovery-poll-ms=1000
automation.worker.heartbeat-ms=10000
