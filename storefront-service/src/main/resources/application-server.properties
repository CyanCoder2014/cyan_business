# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.client.simple.instances.content-service[0].uri=http://content-service:9101
spring.cloud.discovery.client.simple.instances.catalog-service[0].uri=http://catalog-service:9102
spring.cloud.discovery.client.simple.instances.media-service[0].uri=http://media-service:9116
spring.datasource.url=${STOREFRONT_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/storefront_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${STOREFRONT_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${STOREFRONT_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.data.mongodb.uri=${STOREFRONT_SERVICE_MONGODB_URI:mongodb://mongo:27017/storefront_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${STOREFRONT_SERVICE_INTERNAL_USERNAME:storefront_internal}
service.internal.password=${STOREFRONT_SERVICE_INTERNAL_PASSWORD:storefront_secret}
tenant-service.base-url=${TENANT_SERVICE_BASE_URL:http://tenant-service:9129}
tenant-service.internal.username=${TENANT_SERVICE_INTERNAL_USERNAME:tenant_internal}
tenant-service.internal.password=${TENANT_SERVICE_INTERNAL_PASSWORD:tenant_secret}
