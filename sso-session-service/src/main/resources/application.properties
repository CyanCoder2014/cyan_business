server.port=9005
spring.application.name=sso-session-service
platform.openapi.default-security=NONE
eureka.client.serviceUrl.defaultZone=http://admin:CyanAdmin@localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}:${server.port}
spring.datasource.url=${SSO_SESSION_SERVICE_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sso_session_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SSO_SESSION_SERVICE_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SSO_SESSION_SERVICE_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=99
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/.well-known/jwks.json
sso.session.ttl-seconds=86400
sso-session.internal.username=sso_session_internal
sso-session.internal.password=sso_session_secret
tenant-service.base-url=http://localhost:9129
storefront-service.base-url=http://localhost:9115
