# Server deployment profile for Kubernetes service discovery and Envoy Gateway ingress.
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.datasource.url=${FINANCE_SERVICE_DATASOURCE_URL:jdbc:postgresql://postgres:5432/finance_service}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${FINANCE_SERVICE_DATASOURCE_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${FINANCE_SERVICE_DATASOURCE_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}
spring.mongodb.uri=${FINANCE_SERVICE_MONGODB_URI:mongodb://mongo:27017/finance_service}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
processor.service.base-url=${PROCESSOR_SERVICE_BASE_URL:http://processor-service:9108}
event.service.base-url=${EVENT_SERVICE_BASE_URL:http://event-service:9109}
service.internal.username=${FINANCE_SERVICE_INTERNAL_USERNAME:finance_internal}
service.internal.password=${FINANCE_SERVICE_INTERNAL_PASSWORD:finance_secret}
