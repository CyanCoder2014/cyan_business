spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWKS_URI:http://sso-auth-service:9001/.well-known/jwks.json}
service.internal.username=${AI_ORCHESTRATOR_SERVICE_INTERNAL_USERNAME:ai_orchestrator_internal}
service.internal.password=${AI_ORCHESTRATOR_SERVICE_INTERNAL_PASSWORD:ai_orchestrator_secret}
